# =====================================================================
#  Alert rules (Uptime check (URL))  -  UPTIME_ENABLE=true ဆိုမှ တင်မယ်
#  ပြင်ချင်ရင် ဒီဖိုင်ကိုပြင်ပြီး scripts/up ပြန် run (Grafana ကို အလိုအလျောက် restart လုပ်ပေးမယ်)
# =====================================================================
apiVersion: 1
groups:
  - orgId: 1
    name: dtm-uptime
    folder: Monitoring
    interval: 1m
    rules:
      - uid: dtm-uptime-down
        title: URL down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: dtm-prometheus
            model:
              refId: A
              expr: 'probe_success{job="uptime"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              editorMode: code
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: URL ဖွင့်မရဘူး (၂ မိနစ်ကျော်) - ဘယ် URL လဲဆိုတာ alert label ထဲက instance မှာကြည့်
      - uid: dtm-uptime-cert
        title: HTTPS certificate expiring
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: dtm-prometheus
            model:
              refId: A
              expr: '((probe_ssl_earliest_cert_expiry{job="uptime"} - time()) / 86400) and (probe_ssl_earliest_cert_expiry{job="uptime"} > 0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              editorMode: code
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [14]
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: HTTPS certificate ၁၄ ရက်အတွင်း ကုန်မယ် - ပြန်လည်သက်တမ်းတိုးပါ
