# =====================================================================
#  Alert rules (DTM backend / Spring Boot metrics)  -  APP_METRICS_ENABLE=true ဆိုမှ တင်မယ်
#  ပြင်ချင်ရင် ဒီဖိုင်ကိုပြင်ပြီး scripts/up ပြန် run (Grafana ကို အလိုအလျောက် restart လုပ်ပေးမယ်)
# =====================================================================
apiVersion: 1
groups:
  - orgId: 1
    name: dtm-app
    folder: Monitoring
    interval: 1m
    rules:
      - uid: dtm-app-down
        title: DTM app metrics down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: dtm-prometheus
            model:
              refId: A
              expr: 'up{job="dtm-app"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              editorMode: code
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        noDataState: Alerting
        execErrState: Error
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DTM backend ကို ၂ မိနစ်ကျော် ချိတ်မရဘူး (app ကျနေတာ ဒါမှမဟုတ် /actuator/prometheus ဖွင့်မထားတာ)
      - uid: dtm-app-5xx
        title: DTM app 5xx errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: dtm-prometheus
            model:
              refId: A
              expr: 'sum(increase(http_server_requests_seconds_count{status=~"5.."}[5m])) or vector(0)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              editorMode: code
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: နောက်ဆုံး ၅ မိနစ်အတွင်း HTTP 5xx error ၂ ကြိမ်ထက်ပိုပေါ်နေတယ်
      - uid: dtm-app-db-pool
        title: DTM DB connection pool high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: dtm-prometheus
            model:
              refId: A
              expr: 'max(hikaricp_connections_active / hikaricp_connections_max * 100)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              editorMode: code
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Database connection pool ၉၀% ကျော်သုံးနေတယ် (၅ မိနစ်ကျော်)
      - uid: dtm-app-heap
        title: DTM JVM heap high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: dtm-prometheus
            model:
              refId: A
              expr: 'sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) * 100'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
              editorMode: code
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: JVM heap memory ၉၀% ကျော်သုံးနေတယ် (၁၀ မိနစ်ကျော်)
